<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KodNest Premium Build System — Demo</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body class="kn-page">
  <header class="kn-topbar">
    <span class="kn-topbar__project">Project Alpha</span>
    <span class="kn-topbar__progress">Step 2 / 5</span>
    <span class="kn-badge kn-badge--progress">In Progress</span>
  </header>

  <section class="kn-context-header">
    <h1 class="kn-headline">Define the scope</h1>
    <p class="kn-subtext">Set what’s in and out of this step so the build stays focused.</p>
  </section>

  <main class="kn-main">
    <div class="kn-workspace">
      <div class="kn-card">
        <p class="kn-text-block">Primary workspace content goes here. Clean cards, predictable components.</p>
      </div>
    </div>
    <aside class="kn-panel">
      <div class="kn-panel__section">
        <h3 class="kn-panel__section-title">Step</h3>
        <p class="kn-panel__explanation">Short explanation of what this step does and why it matters.</p>
      </div>
      <div class="kn-panel__section">
        <h3 class="kn-panel__section-title">Prompt</h3>
        <textarea class="kn-prompt-box" readonly>Copyable prompt text for this step.</textarea>
        <div class="kn-panel__actions">
          <button type="button" class="kn-btn kn-btn--secondary">Copy</button>
          <button type="button" class="kn-btn kn-btn--primary">Build in Lovable</button>
          <button type="button" class="kn-btn kn-btn--secondary">It Worked</button>
          <button type="button" class="kn-btn kn-btn--secondary">Error</button>
          <button type="button" class="kn-btn kn-btn--secondary">Add Screenshot</button>
        </div>
      </div>
    </aside>
  </main>

  <footer class="kn-proof-footer">
    <p class="kn-proof-footer__title">Proof</p>
    <ul class="kn-proof-footer__list">
      <li class="kn-proof-item">
        <input type="checkbox" id="proof-ui" />
        <label for="proof-ui">UI Built</label>
      </li>
      <li class="kn-proof-item">
        <input type="checkbox" id="proof-logic" />
        <label for="proof-logic">Logic Working</label>
      </li>
      <li class="kn-proof-item">
        <input type="checkbox" id="proof-test" />
        <label for="proof-test">Test Passed</label>
      </li>
      <li class="kn-proof-item">
        <input type="checkbox" id="proof-deployed" />
        <label for="proof-deployed">Deployed</label>
      </li>
    </ul>
  </footer>
</body>
</html>
